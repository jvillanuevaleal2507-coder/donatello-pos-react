name: Donatello - checkout atómico
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/lib/atomicCheckout.js'
      - 'tests/atomic-checkout.test.mjs'
      - '.github/workflows/atomic-checkout-tests.yml'
      - 'supabase/migrations/20261105_pos_checkout_idempotency.sql'
      - 'tests/sql/checkout_*'
      - 'src/lib/atomicLayawayPayments.js'
      - 'tests/atomic-layaway.test.mjs'
      - 'supabase/migrations/20261106_pos_layaway_payments.sql'
      - 'tests/sql/layaway_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atomic-checkout.test.mjs
      - run: node --test tests/atomic-layaway.test.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lotgmhfqzthhhadavwlu.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-build-only

  postgres:
    name: PostgreSQL 17 - idempotencia y carreras
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: atlas_checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: atlas_checkout_test
    steps:
      - uses: actions/checkout@v4
      - name: Preparar esquema sintético
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/checkout_fixture.sql
      - name: Aplicar migración a la base desechable
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105_pos_checkout_idempotency.sql
      - name: Validar replay, rechazo de cambios, rollback y permisos
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_idempotency.sql | grep -qx 'GRANTS_OK'
      - name: Ejecutar dos solicitudes concurrentes con el mismo UUID
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_concurrent.sql > /tmp/cobro-1.txt &
          pid1=$!
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_concurrent.sql > /tmp/cobro-2.txt &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          cmp /tmp/cobro-1.txt /tmp/cobro-2.txt
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT CASE WHEN
            (SELECT count(*) FROM public.test_movements)=2
            AND (SELECT count(*) FROM public.sales)=2
            AND (SELECT count(*) FROM public.layaways)=1
            AND (SELECT stock FROM public.products WHERE id=12)=7
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='completed')=3
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='cancelled')=1
            THEN 'ONCE_OK' ELSE 'DUPLICATE_OR_MISSING' END" | grep -qx 'ONCE_OK'

      - name: Esquema sintetico de abonos
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/layaway_fixture.sql
      - name: Aplicar migracion atomica de apartados solo al laboratorio
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_pos_layaway_payments.sql
      - name: Repeticiones, liquidacion, recibos, permisos y rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_payment.sql | grep -qx 'LAYAWAY_OK'
      - name: Dos solicitudes concurrentes del mismo abono
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_concurrent.sql > /tmp/abono-1.txt &
          pid1=$!
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_concurrent.sql > /tmp/abono-2.txt &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          cmp /tmp/abono-1.txt /tmp/abono-2.txt
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT CASE WHEN
            (SELECT count(*) FROM public.sales)=4
            AND (SELECT status FROM public.layaways WHERE id=202)='paid'
            AND (SELECT count(*) FROM public.layaway_payments WHERE layaway_id=202)=1
            AND (SELECT stock FROM public.products WHERE id=12)=7
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='completed')=6
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='cancelled')=2
            THEN 'CONCURRENT_OK' ELSE 'CONCURRENT_FAILED' END" | grep -qx 'CONCURRENT_OK'
