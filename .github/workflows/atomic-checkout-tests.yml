name: Donatello - checkout atómico
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'laboratorio/**'
      - 'tests/pos-compatibility.test.mjs'
      - 'src/pages/**'
      - 'api/**'
      - 'server/**'
      - 'supabase/functions/**'
      - 'src/lib/atomicCheckout.js'
      - 'src/lib/cashierDraft.js'
      - 'tests/cashier-draft.test.mjs'
      - 'tests/atomic-checkout.test.mjs'
      - '.github/workflows/atomic-checkout-tests.yml'
      - 'supabase/migrations/20261105_pos_checkout_idempotency.sql'
      - 'tests/sql/checkout_*'
      - 'src/lib/atomicLayawayPayments.js'
      - 'src/lib/serverPendingOperations.js'
      - 'tests/server-pending.test.mjs'
      - 'tests/atomic-layaway.test.mjs'
      - 'supabase/migrations/20261106_pos_layaway_payments.sql'
      - 'tests/sql/layaway_*'
      - 'tests/sql/pos_rls_authorization.sql'
      - 'tests/sql/pos_release_preflight_readonly.sql'
      - 'tests/sql/pos_server_recovery.sql'
      - 'tests/sql/pos_server_security.sql'
      - 'tests/sql/pos_operator_read_guards.sql'
      - 'tests/sql/layaway_void_guard.sql'
      - 'tests/sql/void_sale_production_fixture.sql'
      - 'supabase/migrations/20261106_pos_operator_read_guards.sql'
      - 'supabase/migrations/20261106_pos_pending_recovery.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atomic-checkout.test.mjs
      - run: node --test tests/atomic-layaway.test.mjs
      - run: node --test tests/server-pending.test.mjs
      - run: node --test tests/pos-compatibility.test.mjs
      - run: node --check laboratorio/lab.mjs
      - run: node --test tests/lab-proxy.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lotgmhfqzthhhadavwlu.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-build-only

  postgres:
    name: PostgreSQL 17 - idempotencia y carreras
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: atlas_checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: atlas_checkout_test
    steps:
      - uses: actions/checkout@v4
      - name: Preparar esquema sintético
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/checkout_fixture.sql
      - name: Aplicar migración a la base desechable
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105_pos_checkout_idempotency.sql
      - name: Validar replay, rechazo de cambios, rollback y permisos
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_idempotency.sql | grep -qx 'GRANTS_OK'
      - name: Ejecutar dos solicitudes concurrentes con el mismo UUID
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_concurrent.sql > /tmp/cobro-1.txt &
          pid1=$!
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/checkout_concurrent.sql > /tmp/cobro-2.txt &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          cmp /tmp/cobro-1.txt /tmp/cobro-2.txt
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT CASE WHEN
            (SELECT count(*) FROM public.test_movements)=2
            AND (SELECT count(*) FROM public.sales)=2
            AND (SELECT count(*) FROM public.layaways)=1
            AND (SELECT stock FROM public.products WHERE id=12)=7
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='completed')=3
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='cancelled')=1
            THEN 'ONCE_OK' ELSE 'DUPLICATE_OR_MISSING' END" | grep -qx 'ONCE_OK'

      - name: Esquema sintetico de abonos
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/layaway_fixture.sql
      - name: Aplicar migracion atomica de apartados solo al laboratorio
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_pos_layaway_payments.sql
      - name: Repeticiones, liquidacion, recibos, permisos y rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_payment.sql | grep -qx 'LAYAWAY_OK'
      - name: Dos solicitudes concurrentes del mismo abono
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_concurrent.sql > /tmp/abono-1.txt &
          pid1=$!
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_concurrent.sql > /tmp/abono-2.txt &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          cmp /tmp/abono-1.txt /tmp/abono-2.txt
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT CASE WHEN
            (SELECT count(*) FROM public.sales)=4
            AND (SELECT status FROM public.layaways WHERE id=202)='paid'
            AND (SELECT count(*) FROM public.layaway_payments WHERE layaway_id=202)=1
            AND (SELECT stock FROM public.products WHERE id=12)=7
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='completed')=6
            AND (SELECT count(*) FROM private.pos_checkout_requests WHERE state='cancelled')=2
            THEN 'CONCURRENT_OK' ELSE 'CONCURRENT_FAILED' END" | grep -qx 'CONCURRENT_OK'
      - name: Validar descuento y utilidad de liquidaciones en SQL real
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_discount.sql | grep -qx 'DISCOUNT_OK'

      - name: Autorizacion por perfil y RLS sobre tablas sinteticas
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/pos_rls_authorization.sql | grep -qx 'AUTH_RLS_OK'
      - name: Activar reserva y conciliacion solo en PostgreSQL descartable
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_pos_pending_recovery.sql
      - name: Validar recuperacion entre dispositivos y bloqueo sin UUID local
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/pos_server_recovery.sql | grep -qx 'RECOVERY_OK'

      - name: Dos dispositivos no pueden reservar cobros simultaneos
        run: |
          # Actions starts bash -e; disable it briefly to capture both exit codes.
          set +e
          set -uo pipefail
          ADMIN_ID="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          UUID_A="11111111-1111-4111-8111-777777777777"
          UUID_B="11111111-1111-4111-8111-888888888888"
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SET ROLE authenticated; SET request.jwt.claim.sub = '$ADMIN_ID'; SELECT public.donatello_payment_reserve('$UUID_A'::uuid,'checkout')->>'operation_id';" > /tmp/reserve-a.txt 2>&1 &
          p1=$!
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SET ROLE authenticated; SET request.jwt.claim.sub = '$ADMIN_ID'; SELECT public.donatello_payment_reserve('$UUID_B'::uuid,'checkout')->>'operation_id';" > /tmp/reserve-b.txt 2>&1 &
          p2=$!
          wait "$p1"; s1=$?
          wait "$p2"; s2=$?
          set -e
          printf 'Reserva A: exit=%s\\n' "$s1"
          cat /tmp/reserve-a.txt
          printf 'Reserva B: exit=%s\\n' "$s2"
          cat /tmp/reserve-b.txt
          if [ "$s1" -eq "$s2" ]; then
            echo "Unexpected matching reservation outcomes"
            exit 1
          fi
          if [ "$s1" -eq 0 ]; then
            grep -q "$UUID_A" /tmp/reserve-a.txt
            grep -q "Existe otra operacion" /tmp/reserve-b.txt
          else
            grep -q "$UUID_B" /tmp/reserve-b.txt
            grep -q "Existe otra operacion" /tmp/reserve-a.txt
          fi
          pending_id=$(psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT operation_id FROM private.pos_payment_pending WHERE user_id='$ADMIN_ID'")
          test -n "$pending_id"
          test "$(psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT count(*) FROM private.pos_payment_pending")" = "1"
          psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SET ROLE authenticated; SET request.jwt.claim.sub = '$ADMIN_ID'; SELECT public.donatello_checkout_cancel('$pending_id'::uuid); SELECT public.donatello_payment_ack('$pending_id'::uuid);" > /tmp/reserve-cleanup.txt
          test "$(psql -X -v ON_ERROR_STOP=1 -q -t -A -c "SELECT count(*) FROM private.pos_payment_pending")" = "0"


      - name: Aislamiento entre administradores y control de ACK
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/pos_server_security.sql | grep -qx 'RECOVERY_SECURITY_OK'

      - name: Bloquear lectura financiera por operadores, conservar admin
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261106_pos_operator_read_guards.sql
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/pos_operator_read_guards.sql | grep -qx 'OPERATOR_READ_GUARDS_OK'


      - name: Anulacion protege ventas de apartados sin alterar ventas normales
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f tests/sql/void_sale_production_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -q -t -A -f tests/sql/layaway_void_guard.sql | grep -qx 'LAYAWAY_VOID_GUARD_OK'

  windows_launcher:
    name: Windows - doble clic y configuracion del laboratorio
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript del lanzador en Windows
        shell: pwsh
        run: |
          node --check laboratorio/lab.mjs
          node --check laboratorio/lab-proxy.mjs
          node --test tests/lab-proxy.test.mjs
      - name: Ejecutar accesos de Windows sin iniciar Docker
        shell: cmd
        env:
          ATLAS_LAB_CI_SELF_CHECK: '1'
        run: |
          call laboratorio\INICIAR_LABORATORIO.cmd
          if errorlevel 1 exit /b 1
          call laboratorio\CERRAR_LABORATORIO.cmd
          if errorlevel 1 exit /b 1
