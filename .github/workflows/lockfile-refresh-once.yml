name: Temporary lockfile regeneration (branch only)
on:
  push:
    branches:
      - security-atomic-checkout-oct-2026
    paths:
      - '.github/workflows/lockfile-refresh-once.yml'

permissions:
  contents: read

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set Node and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify strict clean installation
        run: npm ci --no-audit --no-fund
      - name: Verify checkout regression tests
        run: node --test tests/checkout.test.cjs
      - name: Verify production build
        run: npm run build
      - name: Print tagged lockfile pieces for secure manual import
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const source = fs.readFileSync('package-lock.json', 'utf8');
          const hash = crypto.createHash('sha256').update(source).digest('hex');
          console.log('LOCKMETA=' + JSON.stringify({length: source.length, sha256: hash}));
          const chunkSize = 768;
          for (let start = 0, index = 0; start < source.length; start += chunkSize, index++) {
            console.log('LOCKCHUNK_' + index + '=' + JSON.stringify(source.slice(start, start + chunkSize)));
          }
          console.log('LOCKEND=' + Math.ceil(source.length / chunkSize));
          NODE
      - name: Retain generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: donatello-pos-corrected-package-lock
          path: package-lock.json
          retention-days: 3
