name: POS public login non-mutating smoke
on:
  push:
    branches:
      - security-atomic-checkout-oct-2026
    paths:
      - 'tests/pos-official-domain-smoke.cjs'
      - '.github/workflows/pos-official-domain-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Chrome test driver
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false --ignore-scripts --no-audit playwright-core@1.56.1
      - name: Verify installed Chrome
        run: command -v google-chrome
      - name: Validate real POS login without login credentials or any transactions
        run: timeout --kill-after=5s 115s node tests/pos-official-domain-smoke.cjs
